<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vid2ArtCAD 标注复核</title>
<style>
:root{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202522;background:#eef1ef;--line:#c8cfcb;--panel:#fff;--green:#18794e;--red:#bd493b;--ink:#202522}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:48px 1fr 58px}header,footer{display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}header strong{font-size:15px;font-weight:650}header .meta{color:#59645e}#status{margin-left:auto;color:#425049}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:0}.stage{min-width:0;display:flex;flex-direction:column;padding:16px;gap:10px}.viewport{position:relative;flex:1;min-height:240px;background:#121513;display:grid;place-items:center;overflow:hidden}.viewport video,.viewport canvas{grid-area:1/1;place-self:center;max-width:100%;max-height:100%;object-fit:contain}.viewport video{display:block}.viewport canvas{z-index:1;touch-action:none;cursor:crosshair}.transport{display:flex;align-items:center;gap:8px}button,select,input{font:inherit;color:inherit;background:white;border:1px solid var(--line);border-radius:4px;min-height:34px;padding:5px 9px}button{cursor:pointer}button:hover{background:#f1f5f2}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);border-color:var(--green);color:white}button.danger{color:var(--red)}input[type=range]{padding:0;min-height:auto;accent-color:var(--green)}#seek{flex:1}#time{font-variant-numeric:tabular-nums;min-width:128px;text-align:right;color:#4c5751}aside{background:#fff;border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:16px}aside h2{font-size:14px;margin:0 0 8px;font-weight:650}.field{display:flex;align-items:center;justify-content:space-between;gap:8px}.field input[type=number]{width:92px}.field input[type=text]{width:150px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tools button[aria-pressed=true]{outline:2px solid var(--green);outline-offset:-2px}.ids{display:flex;gap:6px}.ids select{flex:1}.hint{color:#647068;font-size:12px}.progress{height:5px;background:#e3e8e5}.progress span{height:100%;display:block;width:0;background:var(--green)}.counter{font-variant-numeric:tabular-nums}.divider{height:1px;background:#e1e5e2}footer{border-top:1px solid var(--line);border-bottom:0;color:#4f5c55;justify-content:space-between}.key{font-family:ui-monospace,monospace;border:1px solid #c8cfcb;border-radius:3px;padding:1px 4px;background:#f6f8f6;color:#27332c}
@media(max-width:760px){body{width:100%;min-width:0;grid-template-rows:44px 1fr auto}header strong{white-space:nowrap}header .meta{display:none}main{width:100%;min-width:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(40vh,1fr) auto}.stage{min-width:0;padding:8px}.viewport{min-width:0;min-height:32vh}aside{min-width:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px}.review-block{grid-column:1/-1}.field label,.field output{white-space:nowrap}.field input[type=range]{min-width:48px;flex:1}#brushValue{font-size:12px}footer{font-size:12px;padding:8px;gap:8px}footer span:last-child{display:none}.transport{gap:4px}.transport button{flex:none;white-space:nowrap;font-size:12px;padding:4px 6px}#seek{min-width:48px}#time{width:76px;min-width:76px;font-size:12px}}
</style>
</head>
<body>
<header><strong>Vid2ArtCAD / 标注复核</strong><span class="meta" id="videoName">读取视频…</span><span id="status">连接中</span></header>
<main>
<section class="stage">
<div class="viewport" id="viewport"><video id="video" preload="metadata" src="/media"></video><canvas id="overlay"></canvas></div>
<div class="transport"><button id="prev" title="上一帧 (←)">上一帧</button><button id="play" title="播放/暂停 (Space)">播放</button><button id="next" title="下一帧 (→)">下一帧</button><input id="seek" type="range" min="0" max="0" value="0"><span id="time">0 / 0</span></div>
</section>
<aside>
<section><h2>标注工具</h2><div class="tools"><button id="paint" aria-pressed="true">画笔</button><button id="erase" aria-pressed="false">擦除</button></div></section>
<section><h2>当前部件</h2><div class="ids"><select id="part"></select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input id="partName" type="text" placeholder="部件名称" maxlength="80" style="grid-column:1/-1"><button id="savePart" title="将名称保存到当前 ID">设定名称</button><button id="addPart" title="新增并命名部件 ID">新增部件</button></div><div class="hint" id="partHint" style="margin-top:4px">名称与 ID 在各视角间共用</div></section>
<section><h2>笔刷</h2><div class="field"><label for="brush">直径</label><input id="brush" type="range" min="2" max="80" value="18"><output id="brushValue">18 px</output></div></section>
<section><h2>标注员</h2><input id="reviewer" type="text" placeholder="姓名或工号" autocomplete="name"></section>
<section class="review-block"><div class="divider"></div><h2 style="margin-top:12px">复核进度</h2><div class="field"><span>已保存帧</span><strong class="counter" id="reviewCount">0 / 0</strong></div><div class="progress"><span id="progress"></span></div><button class="primary" id="save" style="width:100%;margin-top:10px">保存当前帧</button><div class="field" style="margin-top:8px"><label for="radius">传播范围（帧）</label><input id="radius" type="number" min="1" max="300" value="30"></div><button id="propagate" style="width:100%;margin-top:6px">从此人工帧传播伪标签</button><div class="hint" id="saveHint" style="margin-top:6px">传播结果不是人工真值；逐帧检查并保存后才计入复核</div></section>
</aside>
</main>
<footer><span>逐帧绘制 part-id；黑色/透明为背景。保存全部帧后标记人工复核完成。</span><span><span class="key">←</span>/<span class="key">→</span> 帧进退　<span class="key">Space</span> 播放　<span class="key">S</span> 保存　<span class="key">[</span>/<span class="key">]</span> 笔刷</span></footer>
<script>
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);let info,frame=-1,mode='paint',painting=false,lastPoint=null,loadTicket=0,dirty=false,loadingFrame=false,saving=false,reviewed=new Set(),ids=[],names=new Map(),colors=new Map(),maskData=new Uint16Array();
function rgb(id){const h=(id*137.508)%360,s=.78,v=.96,c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let a,b,d;if(h<60)[a,b,d]=[c,x,0];else if(h<120)[a,b,d]=[x,c,0];else if(h<180)[a,b,d]=[0,c,x];else if(h<240)[a,b,d]=[0,x,c];else if(h<300)[a,b,d]=[x,0,c];else[a,b,d]=[c,0,x];return [a,b,d].map(q=>Math.round((q+m)*255))}
function hex(id){return '#'+rgb(id).map(x=>x.toString(16).padStart(2,'0')).join('')}
function register(id,name=null){if(id===0||id===65535)return;if(!ids.includes(id)){ids.push(id);colors.set(rgb(id).join(','),id);const o=document.createElement('option');o.value=id;o.style.color=hex(id);$('part').append(o)}if(name)names.set(id,name);const option=[...$('part').options].find(o=>Number(o.value)===id);if(option)option.textContent=names.has(id)?`${names.get(id)} · ${id}`:`部件 ${id}`}
function setMode(next){mode=next;$('paint').setAttribute('aria-pressed',String(mode==='paint'));$('erase').setAttribute('aria-pressed',String(mode==='erase'))}
function displayMask(raw){maskData=new Uint16Array(raw);dirty=false;const data=ctx.createImageData(canvas.width,canvas.height);for(let i=0,p=0;i<maskData.length;i++,p+=4){const id=maskData[i];if(!id||id===65535)continue;if(!colors.has(rgb(id).join(',')))register(id);const c=rgb(id);data.data[p]=c[0];data.data[p+1]=c[1];data.data[p+2]=c[2];data.data[p+3]=155}ctx.putImageData(data,0,0)}
function markDirty(){dirty=true;$('status').textContent='当前帧有未保存更改'}
function discardAllowed(){if(!dirty)return true;if(!confirm('当前帧有未保存更改。继续操作将放弃这些更改，是否继续？'))return false;dirty=false;return true}
async function navigateTo(n){if(saving){$('seek').value=frame;return}if(!discardAllowed()){$('seek').value=frame;return}await loadFrame(n)}
async function loadFrame(n,seekVideo=true){if(!info)return;n=Math.max(0,Math.min(info.frame_count-1,n));frame=n;const ticket=++loadTicket;const target=n/info.fps;if(seekVideo&&Math.abs(video.currentTime-target)>.25/info.fps)video.currentTime=target;$('seek').value=n;$('time').textContent=`${n+1} / ${info.frame_count}`;loadingFrame=true;canvas.style.pointerEvents='none';try{const response=await fetch(`/api/mask?frame=${n}`);if(!response.ok)throw Error('无法加载当前帧掩码');const raw=await response.arrayBuffer();if(ticket===loadTicket)displayMask(raw)}finally{if(ticket===loadTicket){loadingFrame=false;if(!saving)canvas.style.pointerEvents='auto'}}}
function point(event){const r=canvas.getBoundingClientRect();return {x:(event.clientX-r.left)*canvas.width/r.width,y:(event.clientY-r.top)*canvas.height/r.height}}
function stroke(a,b){const r=Number($('brush').value)*canvas.width/canvas.getBoundingClientRect().width/2,x0=Math.max(0,Math.floor(Math.min(a.x,b.x)-r)),x1=Math.min(canvas.width,Math.ceil(Math.max(a.x,b.x)+r)),y0=Math.max(0,Math.floor(Math.min(a.y,b.y)-r)),y1=Math.min(canvas.height,Math.ceil(Math.max(a.y,b.y)+r)),dx=b.x-a.x,dy=b.y-a.y,length2=dx*dx+dy*dy,label=mode==='erase'?0:Number($('part').value);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const px=x+.5,py=y+.5,t=length2?Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/length2)):0,qx=a.x+t*dx,qy=a.y+t*dy;if((px-qx)**2+(py-qy)**2<=r*r)maskData[y*canvas.width+x]=label}const region=ctx.createImageData(x1-x0,y1-y0);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const id=maskData[y*canvas.width+x];if(!id||id===65535)continue;const c=rgb(id),p=((y-y0)*(x1-x0)+(x-x0))*4;region.data[p]=c[0];region.data[p+1]=c[1];region.data[p+2]=c[2];region.data[p+3]=155}ctx.putImageData(region,x0,y0)}
canvas.addEventListener('pointerdown',e=>{if(frame<0||loadingFrame||saving)return;if(mode==='paint'&&!Number($('part').value)){$('saveHint').textContent='请先选择或新增部件 ID';return}if(!video.paused)video.pause();painting=true;canvas.setPointerCapture(e.pointerId);lastPoint=point(e);stroke(lastPoint,lastPoint);markDirty()});canvas.addEventListener('pointermove',e=>{if(!painting)return;const p=point(e);stroke(lastPoint,p);lastPoint=p;markDirty()});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>{painting=false;lastPoint=null});
async function saveFrame(){if(frame<0||saving||loadingFrame)return;if(!$('reviewer').value.trim()){$('saveHint').textContent='请先填写标注员姓名或工号';$('reviewer').focus();return}const savedFrame=frame,out=new Uint8Array(maskData.length*2),view=new DataView(out.buffer);for(let i=0,p=0;i<maskData.length;i++,p+=2)view.setUint16(p,maskData[i],true);saving=true;video.pause();canvas.style.pointerEvents='none';$('save').disabled=true;$('saveHint').textContent='正在保存…';try{const reviewer=encodeURIComponent($('reviewer').value);const result=await fetch(`/api/mask?frame=${savedFrame}&reviewer=${reviewer}`,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:out});const data=await result.json();if(!result.ok)throw Error(data.error||'保存失败');dirty=false;updateReview(data);$('saveHint').textContent=data.status==='human_review_complete'?'所有帧已完成人工复核':'当前帧已保存并计入复核';}catch(e){$('saveHint').textContent=e.message}finally{saving=false;$('save').disabled=false;if(frame>=0&&!loadingFrame)canvas.style.pointerEvents='auto'}}
async function propagate(){if(dirty){$('saveHint').textContent='当前帧有未保存更改，请先保存后再传播';return}if(!reviewed.has(frame)){$('saveHint').textContent='请先保存当前帧为人工种子';return}$('propagate').disabled=true;$('saveHint').textContent='正在计算光流并生成待复核伪标签…';try{const response=await fetch('/api/propagate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seed_frame:frame,radius:Number($('radius').value),view:info.view})});const result=await response.json();if(!response.ok)throw Error(result.error||'传播失败');$('saveHint').textContent=`${result.view} 已生成 ${result.written_frames.length} 帧伪标签；跳过 ${result.skipped_frames.length} 帧。请逐帧检查并点击保存。`;await loadFrame(frame)}catch(e){$('saveHint').textContent=e.message}finally{$('propagate').disabled=false}}
function updateReview(review){reviewed=new Set(review.reviewed_frames||[]);$('reviewCount').textContent=`${review.reviewed_count??reviewed.size} / ${info.frame_count}`;$('progress').style.width=`${100*reviewed.size/info.frame_count}%`;if(review.status==='human_review_complete')$('status').textContent='人工复核完成';else $('status').textContent=`复核中 · ${reviewed.size}/${info.frame_count} 帧`}
function step(delta){navigateTo(frame+delta)}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{if(saving||loadingFrame)return;if(video.paused){if(!discardAllowed())return;video.play()}else video.pause()};video.onplay=()=>$('play').textContent='暂停';video.onpause=()=>$('play').textContent='播放';video.ontimeupdate=()=>{if(!info||saving)return;const n=Math.min(info.frame_count-1,Math.max(0,Math.floor(video.currentTime*info.fps)));if(n!==frame){if(dirty){video.pause();video.currentTime=frame/info.fps;return}loadFrame(n,false)}};video.onseeked=()=>{if(saving)return;const n=Math.min(info.frame_count-1,Math.max(0,Math.round(video.currentTime*info.fps)));if(n!==frame){if(dirty){video.currentTime=frame/info.fps;return}loadFrame(n,false)}};$('seek').onchange=()=>navigateTo(Number($('seek').value));$('save').onclick=saveFrame;$('paint').onclick=()=>setMode('paint');$('erase').onclick=()=>setMode('erase');$('brush').oninput=()=> $('brushValue').textContent=`${$('brush').value} px`;
$('propagate').onclick=propagate;
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click()}else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key.toLowerCase()==='s')saveFrame();else if(e.key==='[')$('brush').value=Math.max(2,Number($('brush').value)-2);else if(e.key===']')$('brush').value=Math.min(80,Number($('brush').value)+2);$('brushValue').textContent=`${$('brush').value} px`});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function savePart(partId){const name=$('partName').value.trim();if(!name){$('partHint').textContent='请填写可区分的部件名称';$('partName').focus();return}try{const response=await fetch('/api/parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({part_id:partId,name})});const result=await response.json();if(!response.ok)throw Error(result.error||'保存部件失败');register(partId,name);$('part').value=partId;$('partName').value='';$('partHint').textContent=`已保存 ${name} · ID ${partId}`}catch(e){$('partHint').textContent=e.message}}
async function addPart(){let next=1;while(ids.includes(next)&&next<65535)next++;if(next>=65535){$('partHint').textContent='部件 ID 已用尽';return}await savePart(next)}
async function start(){try{info=await(await fetch('/api/info')).json();$('videoName').textContent=`${info.video} · ${info.width}×${info.height} · ${info.fps} fps`;$('seek').max=info.frame_count-1;canvas.width=info.width;canvas.height=info.height;const mapping=await(await fetch('/api/parts')).json();for(const part of mapping.parts||[])register(Number(part.part_id),part.name);const metadataReady=new Promise(resolve=>video.onloadedmetadata=resolve);video.load();await metadataReady;const review=info.review;updateReview(review);$('reviewer').value=review.reviewer||'';const done=new Set(review.reviewed_frames||[]);let initial=0;while(initial<info.frame_count&&done.has(initial))initial++;if(initial===info.frame_count)initial=0;await loadFrame(initial)}catch(e){$('status').textContent=e.message}}
$('savePart').onclick=()=>{const id=Number($('part').value);if(id)savePart(id);else $('partHint').textContent='请先选择或新增部件 ID'};
$('addPart').onclick=addPart;
start();
</script>
</body>
</html>
